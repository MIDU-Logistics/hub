<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIDU Logistics Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B273D">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<script src="vendor/xlsx.full.min.js" defer></script>
<script src="vendor/html2pdf.bundle.min.js" defer></script>

<script src="local.js"></script>
<style>
:root{--navy:#1B273D;--navy2:#2C3B57;--blue:#2F6FDE;--green:#1E9E6A;--amber:#D9961A;--red:#D2463C;--teal:#138A8A;--plum:#714B67;--ink:#1E2433;--muted:#5B6476;--line:#DDE2EA;--soft:#F2F4F8;--soft2:#E9EDF4;--bg:#F6F7FA}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button{font:inherit;cursor:pointer}input,select,textarea{font:inherit}
.app{display:grid;grid-template-columns:250px 1fr;grid-template-rows:60px 1fr;height:100vh}
.top{grid-column:1/3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;padding:0 18px}
.top img{height:26px}.top .ttl{font-weight:700;font-size:16px}.top .ttl small{display:block;font-weight:400;font-size:11px;color:#9FB4DA}
.top .sp{flex:1}
.top select{background:var(--navy2);color:#fff;border:1px solid #44557A;border-radius:8px;padding:6px 8px}
.lang{display:flex;background:var(--navy2);border-radius:20px;padding:3px}
.lang button{border:0;background:none;color:#C9D3E6;padding:5px 12px;border-radius:16px;font-weight:600}
.lang button.on{background:#fff;color:var(--navy)}
.side{background:#fff;border-inline-end:1px solid var(--line);padding:10px 10px 20px;overflow:auto}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:12px 10px 4px}
html[lang=ar] .nav .grp{letter-spacing:0}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:9px;text-align:start;color:var(--ink);font-weight:600;font-size:13px}
.nav button .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.nav button:hover{background:var(--soft)}.nav button.on{background:var(--soft2);color:var(--navy)}
.side .foot{margin-top:14px;font-size:11px;color:var(--muted);padding:10px;border-top:1px solid var(--line);line-height:1.5}
main{overflow:auto;padding:22px 26px 40px}
h1{font-size:22px;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--muted);margin:0 0 18px}
.grid{display:grid;gap:14px}
.g5{grid-template-columns:repeat(5,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:1150px){.g5{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.g3,.g2,.g5,.g4{grid-template-columns:1fr}.top .ttl small{display:none}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .v{font-size:24px;font-weight:700;color:var(--navy)}.kpi .l{font-size:12px;color:var(--muted)}
.kpi.warn .v{color:var(--red)}.kpi.ok .v{color:var(--green)}
.mod{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mod .hd{display:flex;gap:12px;align-items:center}
.mod .ic{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:20px;color:#fff;flex:none}
.mod b{font-size:15px;color:var(--navy)}.mod .d{font-size:12px;color:var(--muted)}
.mod .st{display:flex;gap:8px;flex-wrap:wrap}
.mod .links{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px;color:var(--navy)}
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 14px}
@media(max-width:1000px){.fg{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:5px;position:relative}
.f.w2{grid-column:span 2}.f.w4{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--navy)}.f label .req{color:var(--red)}
.f input,.f select,.f textarea,table input,table select{border:1px solid #C9D1DF;border-radius:8px;padding:8px 10px;background:#FFFDF0;width:100%}
.f input[readonly]{background:var(--soft);color:var(--muted)}
input:focus,select:focus{outline:2px solid #BFD2F7;border-color:var(--blue)}
.en{direction:ltr;text-align:left}
.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.bad{border-color:var(--red)!important;background:#FDF0EF!important}
.tip{position:absolute;top:100%;inset-inline-start:0;margin-top:3px;background:var(--red);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;z-index:5;white-space:nowrap}
.hint{font-size:11px;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--navy);color:#fff;text-align:start;padding:8px;font-weight:600}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:nth-child(even) td{background:#FAFBFC}
table.t tr.tot td{background:var(--soft2);font-weight:700}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.b{border:0;border-radius:9px;padding:9px 16px;font-weight:700;color:#fff;background:var(--blue)}
.b.g{background:var(--green)}.b.n{background:var(--navy)}.b.l{background:var(--soft2);color:var(--navy)}.b.r{background:var(--red)}.b.a{background:var(--amber)}.b.t{background:var(--teal)}.b.p{background:var(--plum)}
.b.sm{padding:5px 10px;font-size:12px}.b:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700;background:var(--soft2);color:var(--navy);white-space:nowrap}
.tag.g{background:#DDF2E8;color:#13704A}.tag.a{background:#FAEBCB;color:#8A5B05}.tag.r{background:#F8DCDA;color:#9C2B23}.tag.b{background:#DEE8FB;color:#1D4FB0}.tag.p{background:#EEE3EC;color:#5A3A52}
.msg{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-weight:600;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msg.ok{background:#EAF6F0;color:#13704A}.msg.err{background:#FBECEB;color:#9C2B23}
.search input{width:100%;font-size:18px;padding:14px 16px;border-radius:12px;border:2px solid var(--blue);background:#fff}
.res h3{font-size:13px;color:var(--muted);text-transform:uppercase;margin:18px 0 8px}
.empty{color:var(--muted);padding:20px;text-align:center}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-weight:600;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bar{height:10px;background:var(--soft2);border-radius:6px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%;border-radius:6px}
.flow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.flow span{padding:6px 12px;border-radius:20px;background:var(--soft2);font-size:12px;font-weight:700;color:var(--navy)}
.flow span.on{background:var(--blue);color:#fff}.flow em{color:var(--muted);font-style:normal}
.ov{position:fixed;inset:0;background:rgba(15,22,36,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 10px;z-index:50}
.ov.on{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:900px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}.mbar .sp{flex:1}
.doc{padding:28px 34px;direction:ltr;text-align:left;font-family:Arial,sans-serif;color:#111;font-size:12.5px}
.doc .dh{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #1B273D;padding-bottom:10px}
.doc .dh img{height:34px}.doc .dh .dt{text-align:right}.doc .dh .dt b{display:block;font-size:17px;color:#1B273D}
.doc .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;margin:14px 0}
.doc .meta div span{color:#666;display:inline-block;width:130px}
.doc table{width:100%;border-collapse:collapse;margin-top:8px}
.doc th,.doc td{border:1px solid #9AA4B5;padding:6px;text-align:left;font-size:12px}
.doc th{background:#E9EDF4}.doc td.r,.doc th.r{text-align:right}
.doc .tot{margin-top:8px;margin-left:auto;width:300px}.doc .tot td{font-weight:700}
.doc .sig{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}
.doc .sig div{border-top:1px solid #333;padding-top:6px;font-size:11px;height:58px}
.doc .stamp{border:2px dashed #9AA4B5;height:66px;width:160px;margin-top:14px;display:grid;place-items:center;color:#9AA4B5;font-weight:700}
.doc .big{font-size:20px;font-weight:700;padding:8px 14px;border-radius:6px;display:inline-block;margin:10px 0}
.doc .foot{margin-top:18px;font-size:10px;color:#777;border-top:1px solid #ccc;padding-top:6px}
.toast{position:fixed;bottom:18px;inset-inline-end:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:60}
.toast.on{opacity:1}
.chk{width:18px;height:18px}
.sync{font-size:12px;color:#C9D3E6;align-items:center;gap:4px}.sync.err{color:#FFB4AC}.sync.ok{color:#9FE3C2}
.banner{background:#FFF6E0;border:1px solid #F0D58C;border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:5px 10px;font-size:12px;cursor:pointer;border-inline-end:1px solid var(--line)}
.seg label:last-child{border:0}.seg input{display:none}
.seg input:checked+span{font-weight:700}
.seg label:has(input:checked){background:var(--navy);color:#fff}
@media print{body{background:#fff!important}body *{visibility:hidden!important}#mBody,#mBody *{visibility:visible!important}#mBody{position:absolute;left:0;top:0;width:100%}.ov{position:static;background:none;padding:0;display:block}.mbox{box-shadow:none;max-width:none}.mbar,#mHint{display:none}@page{size:A4;margin:10mm}}
</style>
</head>

/* Utilities follow the SharePoint structure used by the Power App: "Utility Items" (U001…) and
   "Utility Readings" (one row per item per day, key = ItemKey|yyyy-MM-dd). Weeks run Saturday–Friday.
   Contractor = the item's "Charge To"; rate = the category rate (Utility Rates list, or the defaults). */
const uItem=k=>D.uitems.find(i=>i.key===k);
const uSort=(a,b)=>(a.sort||0)-(b.sort||0);
const utCats=()=>[...new Set(D.uitems.slice().sort(uSort).map(i=>i.cat))];
/* Contractor shares per item (Utility Items: Concrete % / MCC % / EMCO %, 1 = 100 %). The rest is MIDU.

const PCT={"Concrete Division":"concretePct","Concrete":"concretePct","MCC":"mccPct","EMCO":"emcoPct"};
function sharesOf(it){const s={};let any=false;it=it||{};
 CONTR.forEach(c=>{const k=PCT[c],v=k?it[k]:null;if(v!==null&&v!==undefined&&v!==""){any=true;if(+v)s[c]=+v;}});

 return any?s:null;}
const shareOf=(u,c)=>{const s=sharesOf(uItem(u.item));return s?(s[c]||0):0;};
const midShare=u=>{const s=sharesOf(uItem(u.item));return s?1-Object.values(s).reduce((a,v)=>a+v,0):0;};
const isSet=u=>!!sharesOf(uItem(u.item));
const splitTxt=it=>{const s=sharesOf(it);if(!s)return "";const t=Object.entries(s).map(([c,v])=>c+" "+Math.round(v*100)+"%");return t.length?t.join(" · "):"MIDU";};
const amtOf=u=>u.qty*utRate(u.type).rate;
const r2=n=>Math.round(n*100)/100;
const addDays=(ds,n)=>{const d=new Date(ds+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const wkStart=ds=>{const d=new Date(ds+"T12:00:00Z");return addDays(ds,-((d.getUTCDay()+1)%7));};

/* ============================ HR ATTENDANCE ============================ */
/* Rules (as agreed with Logistics, same idea as the MBL system):
   - first punch of the day = In, last punch = Out
   - late arrival (after 07:15) or early exit (before 17:00) → warning with the missing duty hours; the employee
     explains with a CHANGE REQUEST that HR approves or rejects (approved = corrected times are used)
   - no punch on a working day → "Absent – leave request needed"; without an approved LEAVE REQUEST the day is
     counted as absent for salary deduction
   - leave entered or approved by HR → the day shows "On Leave" and is not counted as absent
   - Friday is the weekend */
const SH={in:7*60,late:7*60+15,out:17*60,hours:10};
const WEEKEND=[5];
const LEAVE_TYPES=["Annual leave","Sick leave","Emergency leave","Unpaid leave","Business trip","Other"];
const mmOf=s=>+s.slice(0,2)*60+ +s.slice(3);
const isWorkDay=ds=>WEEKEND.indexOf(new Date(ds+"T12:00:00Z").getUTCDay())<0;
const reqsOf=(no,ds,type)=>(D.areq||[]).filter(q=>q.type===type&&q.emp===no&&(type==="Leave"?q.from<=ds&&q.to>=ds:q.date===ds));
const whoAmI=()=>M365.signedIn?M365.user.name:(LOCAL.connected?LOCAL.user:"HR");
const canHR=()=>!M365.signedIn||M365.roles==="*"||M365.roles.some(r=>["hr","admin","management"].indexOf(r)>-1);
const hhmm=h=>{const m=Math.round(h*60);return Math.floor(m/60)+":"+String(m%60).padStart(2,"0");};
function attDay(ds){const isToday=ds===today(),future=ds>today(),work=isWorkDay(ds);
 return D.emps.map(e=>{const p=D.punches.filter(x=>x.emp===e.no&&x.ts.startsWith(ds)).map(x=>x.ts.slice(11,16)).sort();
  const dev=D.punches.find(x=>x.emp===e.no&&x.ts.startsWith(ds))?.dev||"";
  const chg=reqsOf(e.no,ds,"Change").find(q=>q.status==="Approved"),chgPend=reqsOf(e.no,ds,"Change").find(q=>q.status==="Pending");
  const lv=reqsOf(e.no,ds,"Leave").find(q=>q.status==="Approved"),lvPend=reqsOf(e.no,ds,"Leave").find(q=>q.status==="Pending");
  let inT=p[0]||"",out=p.length>1?p[p.length-1]:"";
  if(chg){if(chg.inTime)inT=chg.inTime;if(chg.outTime)out=chg.outTime;}
  const hrs=inT&&out?Math.max(mmOf(out)-mmOf(inT),0)/60:0;
  const late=!!inT&&!chg&&mmOf(inT)>SH.late;
  const early=!!out&&!chg&&!isToday&&mmOf(out)<SH.out;
  const missOut=!!inT&&!out&&!isToday&&!chg;
  const short=inT&&out&&!isToday&&!chg&&(late||early)?Math.max(SH.hours-hrs,0):0;   // missing duty hours only when late or early
  let st;
  if(lv)st="leave";else if(future)st="future";else if(!inT)st=!work?"weekend":isToday?"notYet":lvPend?"absentPending":"absent";
  else if(isToday&&!out)st="onDuty";else if(missOut)st="missingOut";else if(late&&early)st="lateEarly";else if(late)st="late";else if(early)st="early";else st=chg?"corrected":"present";
  return {e,in:inT,out,hrs,late,early,short,dev,st,lv,chg,chgPend,lvPend,ds};});}
const needsChange=x=>["late","early","lateEarly","missingOut"].indexOf(x.st)>-1;
function stTag(x){const S={leave:[tr("On Leave","في إجازة")+(x.lv?" – "+x.lv.leaveType:""),"b"],present:[tr("Present","حاضر"),"g"],corrected:[tr("Present (corrected)","حاضر (مصحح)"),"g"],
  late:[tr("Late arrival","تأخر في الحضور"),"a"],early:[tr("Early exit","خروج مبكر"),"a"],lateEarly:[tr("Late + early exit","تأخر + خروج مبكر"),"a"],missingOut:[tr("No out-punch","لا توجد بصمة خروج"),"a"],
  onDuty:[tr("On duty","على رأس العمل"),"b"],notYet:[tr("Not punched yet","لم يبصم بعد"),""],absent:[tr("Absent – leave request needed","غائب – مطلوب طلب إجازة"),"r"],
  absentPending:[tr("Absent – leave request pending","غائب – طلب الإجازة قيد الاعتماد"),"a"],weekend:[tr("Weekend","عطلة"),""],future:["",""]}[x.st]||["",""];
 return S[0]?tag(S[0],S[1])+(x.short>0?" "+tag("−"+hhmm(x.short)+" h","r"):""):"";}
function actBtn(x){if(needsChange(x))return x.chgPend?tag(tr("Change request pending","طلب التعديل قيد الاعتماد"),"a"):`<button class="b l sm" data-cr="${esc(x.e.no)}|${x.ds}">${tr("Change request","طلب تعديل")}</button>`;
 if(x.st==="absent")return `<button class="b l sm" data-lr="${esc(x.e.no)}|${x.ds}">${tr("Leave request","طلب إجازة")}</button>`;return "";}
/* month / week figures per employee */
function attSum(days){return D.emps.map((e,i)=>{let pd=0,lvd=0,ab=0,lt=0,ea=0,sh=0,h=0,ot=0;days.forEach(d=>{const x=attDay(d)[i];
  if(x.st==="leave"){if(isWorkDay(d))lvd++;return;}if(x.in){pd++;if(x.late)lt++;if(x.early)ea++;sh+=x.short;h+=x.hrs;ot+=Math.max(x.hrs-SH.hours,0);}else if(x.st==="absent"||x.st==="absentPending")ab++;});
 return {e,pd,lvd,ab,lt,ea,sh,h,ot};});}
const monthDays=m=>{const out=[];for(let d=new Date(m+"-01T12:00:00Z");d.toISOString().slice(0,7)===m;d.setUTCDate(d.getUTCDate()+1)){const ds=d.toISOString().slice(0,10);if(ds<=today()&&isWorkDay(ds))out.push(ds);}return out;};

function gdoc({title,no,date,meta=[],cols,rows,totals=[],sig=["Prepared by","Checked by","Approved by"],stamp="",extra="",foot="",right=[]}){
 return `<div class="doc"><div class="dh"><img src="${LOGO}" alt="MIDU"><div class="dt"><b>${title}</b>MIDU | LOGISTICS DEPARTMENT</div></div>
 <div class="meta"><div><span>Document No.</span><b>${esc(no)}</b></div><div><span>Date</span><b>${esc(date)}</b></div>${meta.filter(m=>m[1]!==undefined&&m[1]!=="").map(([k,v])=>`<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>${extra}
 <table><tr>${cols.map((c,i)=>`<th class="${right.includes(i)?"r":""}">${c}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${right.includes(i)?"r":""}">${esc(c)}</td>`).join("")}</tr>`).join("")}</table>
 ${totals.length?`<table class="tot">${totals.map(([k,v])=>`<tr><td>${k}</td><td class="r">${v}</td></tr>`).join("")}</table>`:""}
 <div class="sig">${sig.map(s=>`<div>${s}<br>Name / Signature / Date</div>`).join("")}</div>${stamp?`<div class="stamp">${stamp}</div>`:""}
 <div class="foot">Generated by MIDU Logistics Hub · ${esc(no)}${foot?" · "+foot:""}</div></div>`;}
function whDoc(d){const T={GRN:"MATERIAL RECEIVING NOTE (GRN)",MDS:"MATERIAL DISPATCH SHEET (MDS)",MRS:"MATERIAL RETURN SHEET (MRS)",SC:"STOCK COUNT SHEET",AHS:"ASSET HANDOVER SHEET"}[d.type];
 if(d.type==="GRN")return gdoc({title:T,no:d.no,date:d.date,meta:[["Supplier",d.party],["PO No.",d.po],["Delivery note",d.dn],["Warehouse",WH[d.wh].name],["Location",d.loc],["Received by",d.by]],cols:["#","Item code","Description","Unit","Qty","Condition"],rows:d.lines.map((l,i)=>[i+1,l.code,item(l.code)?.desc||"(new item)",item(l.code)?.unit||"",l.qty,l.cond]),sig:["Delivered by (driver)","Received by (storekeeper)","Logistics approval"],stamp:"RECEIVED",right:[4]});
 if(d.type==="MDS")return gdoc({title:T,no:d.no,date:d.date,meta:[["Dispatch type",d.dtype],["Receiver",d.party],["Employee / Iqama",d.iqama],["From",WH[d.wh].name+" › "+d.loc],["To",d.to],["Return by",d.returnBy]],cols:["#","Item / Asset ID","Description","Qty","Condition"],rows:d.lines.map((l,i)=>[i+1,l.asset||l.code,item(l.code)?.desc||"",l.qty,l.cond]),sig:["Received by","Issued by (storekeeper)","Logistics approval"],stamp:"DISPATCHED",right:[3]});
 if(d.type==="MRS")return gdoc({title:T,no:d.no,date:d.date,meta:[["Returned by",d.party],["Employee / Iqama",d.iqama],["Returned to",WH[d.wh].name+" › "+d.loc]],cols:["#","Item / Asset ID","Description","Qty","Condition"],rows:d.lines.map((l,i)=>[i+1,l.asset||l.code,item(l.code)?.desc||"",l.qty,l.cond]),sig:["Returned by","Received by (storekeeper)","Logistics approval"],stamp:"RECEIVED",right:[3]});
 if(d.type==="SC")return gdoc({title:T,no:d.no,date:d.date,meta:[["Location",WH[d.wh].name+" › "+d.loc],["Status","Pending approval"]],cols:["#","Item code","Description","Counted","System","Difference"],rows:d.lines.map((l,i)=>[i+1,l.code,item(l.code)?.desc||"",l.qty,l.sys,(l.qty-l.sys>0?"+":"")+(l.qty-l.sys)]),sig:["Counted by","Checked by","Approved by (Finance)"],right:[3,4,5]});
 const a=d.asset||D.assets.find(x=>x.id===d.lines[0].asset);return gdoc({title:T,no:d.no,date:d.date,meta:[["Receiver",d.party],["Employee / Iqama",d.iqama],["Ownership",a.own]],cols:["Asset ID","Description","Brand","Model","Serial","Item code"],rows:[[a.id,a.desc,a.brand,a.model,a.serial,a.itemCode]],sig:["Receiver","Logistics","HR"]});}
const prDoc=p=>gdoc({title:"PURCHASE REQUEST (PR)",no:p.no,date:p.date,meta:[["Cost center",p.cc],["Requested by",p.req],["Required date",p.need],["Justification",p.just]],cols:["#","Item code","Description","Qty","Est. unit price","Est. total","Class"],rows:p.lines.map((l,i)=>[i+1,l.code||"—",l.desc,l.qty,money(l.est),money(l.qty*l.est),l.cls]),totals:[["Estimated total (SAR)",money(p.lines.reduce((a,l)=>a+l.qty*l.est,0))]],sig:["Requested by (Logistics)","Approved by (Project Director)","Received by (Procurement)"],right:[3,4,5]});

function poDoc(p){const sub=poTotal(p);return gdoc({title:p.kind==="PC"?"PETTY CASH VOUCHER":"PURCHASE ORDER",no:p.no,date:p.date,meta:[["Supplier",p.sup],["Cost center",p.cc],["PR",p.pr],["CQS",p.cqs]],cols:["#","Item code","Description","Qty","Unit price","Amount","Class"],rows:p.lines.map((l,i)=>[i+1,l.code||"—",l.desc,l.qty,money(l.price),money(l.qty*l.price),l.cls]),totals:[["Subtotal (SAR)",money(sub)],["VAT 15%",money(sub*.15)],["Total (SAR)",money(sub*1.15)]],sig:p.kind==="PC"?["Paid to / received by","Logistics","Finance"]:["Project Director","Finance Manager","CEO"],right:[3,4,5],foot:p.kind==="PC"?"Petty cash limit SAR 5,000":"Payment only after full receipt (3-way match)"});}

function findDoc(no){const w=D.docs.find(d=>d.no===no);if(w)return w;const p=D.prs.find(x=>x.no===no);if(p)return{no,html:prDoc(p)};const c=D.cqs.find(x=>x.no===no);if(c)return{no,html:cqsDoc(c)};const o=D.pos.find(x=>x.no===no);if(o)return{no,html:poDoc(o)};
 const d=D.dns.find(x=>x.no===no);if(d)return{no,html:dnDoc(d)};const r=D.mreq.find(x=>x.no===no);if(r)return{no,html:mrDoc(r)};const k=D.mcl.find(x=>x.no===no);if(k)return{no,html:mclDoc(k)};return null;}
function clearanceHtml(e){const h=holdings(e.iqama),ok=!h.length;const tb=a=>a.length?`<table><tr><th>Item / Asset</th><th>Description</th><th>Qty</th><th>Issued on (MDS)</th></tr>${a.map(x=>`<tr><td>${esc(x.asset||x.code)}</td><td>${esc(item(x.code)?.desc||"")}</td><td>${x.qty}</td><td>${x.doc}</td></tr>`).join("")}</table>`:"<p>None</p>";
 return gdoc({title:"EMPLOYEE CLEARANCE — WAREHOUSE & ASSETS",no:"CLR-"+e.no+"-"+today().replace(/-/g,""),date:today(),meta:[["Employee",e.name],["Iqama / ID",e.iqama],["Employee No.",e.no],["Department",e.dept]],extra:`<div class="big" style="background:${ok?"#DDF2E8;color:#13704A":"#F8DCDA;color:#9C2B23"}">${ok?"CLEARED":"NOT CLEARED — "+h.length+" item(s) to return"}</div><h4>Assets held</h4>${tb(h.filter(x=>x.asset))}<h4>Warehouse items held</h4>`,cols:["Item / Asset","Description","Qty","Issued on (MDS)"],rows:h.filter(x=>!x.asset).map(x=>[x.code,item(x.code)?.desc||"",x.qty,x.doc]),sig:["Employee","Logistics","HR"]});}

function pdfFolder(no){const ym=today().slice(0,7);const p=[[/^GRN-/,"01 Warehouse & Assets/01 Signed GRN/"+ym],[/^MDS-/,"01 Warehouse & Assets/02 Signed MDS/"+ym],[/^MRS-/,"01 Warehouse & Assets/03 Signed MRS/"+ym],[/^AHS-/,"01 Warehouse & Assets/04 Asset Handover Sheets/"+ym],[/^SC-/,"01 Warehouse & Assets/05 Stock Counts"],[/^PR-/,"03 Procurement/01 Purchase Requests/"+ym],[/^CQS-/,"03 Procurement/02 CQS/"+ym],[/^MIDU-PO-/,"03 Procurement/03 Purchase Orders/"+ym],[/^PC-/,"03 Procurement/04 Petty Cash/"+ym],[/^ASP-MIDU-/,"02 Utilities/05 Debit Notes/"+ym],[/^MR-/,"06 Maintenance/02 Maintenance Requests/"+ym],[/^MCL-/,"06 Maintenance/01 Monthly Checklists"],[/^ATT-/,"05 HR/04 Monthly Attendance Reports"],[/^CLR-|^Clearance/,"05 HR/05 Clearances"]].find(([re])=>re.test(no));return p?p[1]:"00 System/Other Documents";}
function docPage(html,fname){const css=[...document.styleSheets[0].cssRules].filter(r=>r.selectorText&&r.selectorText.startsWith(".doc")).map(r=>r.cssText).join("\n");return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${fname}</title><style>body{margin:0}@page{size:A4;margin:12mm}${css}</style></head><body>${html}</body></html>`;}
